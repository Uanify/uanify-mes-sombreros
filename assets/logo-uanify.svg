<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 100" width="100%" height="100%">
  <defs>
    <linearGradient id="tombstoneGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B45309" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>
    <linearGradient id="leatherAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5E3C" />
      <stop offset="100%" stop-color="#6E4426" />
    </linearGradient>
  </defs>
  
  <!-- Western Star / Hat Emblem -->
  <g transform="translate(10, 15)">
    <polygon points="35,4 66,22 66,58 35,76 4,58 4,22" fill="#FEF3C7" stroke="url(#tombstoneGold)" stroke-width="3" stroke-linejoin="round"/>
    <!-- Cowboy Hat Brim Profile -->
    <path d="M12,46 C24,34 46,34 58,46" fill="none" stroke="#0F172A" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M22,42 C26,26 44,26 48,42" fill="none" stroke="url(#tombstoneGold)" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Star In Center -->
    <polygon points="35,32 38,39 45,39 40,43 42,50 35,46 28,50 30,43 25,39 32,39" fill="url(#tombstoneGold)"/>
  </g>

  <!-- Typography Tombstone -->
  <text x="85" y="52" font-family="'Outfit', 'Impact', -apple-system, sans-serif" font-weight="900" font-size="34" fill="#0F172A" letter-spacing="1">
    TOMBSTONE
  </text>
  <text x="325" y="52" font-family="'Outfit', sans-serif" font-weight="800" font-size="20" fill="url(#tombstoneGold)" letter-spacing="3">
    HATS
  </text>
  
  <!-- Subtitle with Uanify MES -->
  <text x="87" y="74" font-family="'Inter', monospace" font-weight="600" font-size="11" fill="#64748B" letter-spacing="1.5">
    SISTEMA MES DE PLANTA · <tspan fill="#8B5E3C" font-weight="700">POWERED BY UANIFY</tspan>
  </text>
</svg>
